[package]
name = "coc-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "N-API addon exposing CoC's native capabilities to Node, one module per capability"

[lib]
crate-type = ["cdylib"]

[dependencies]
coc-native-core = { path = "../core" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
