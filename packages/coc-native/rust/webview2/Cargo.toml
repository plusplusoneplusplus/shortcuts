[package]
name = "coc-webview2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Desktop-only WebView2 host with an isolated STA UI message pump"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
