[package]
name = "coc-wkwebview"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Desktop-only macOS WKWebView host with an AppKit main-thread run loop"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSThread", "NSUUID"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration"] }
dispatch2 = "0.3"
