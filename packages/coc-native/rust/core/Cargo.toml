[package]
name = "coc-native-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native primitives for CoC file-path and Notes content indexes"

[dependencies]
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4"
# Pinned exactly: 0.87.1 declares a dependency on gix-worktree-stream 0.36.1,
# which was never published, so it cannot be resolved at all.
gix = { version = "=0.87.0", default-features = false, features = ["revision", "sha1", "max-performance-safe"] }
rayon = "1"
# Already in the tree via gix-tempfile; promoted from a dev-dependency because
# `git diff --no-index` needs two real files to compare, and mkdtemp's 0700
# directory plus RAII cleanup is what the TypeScript's mkdtemp + finally did.
tempfile = "3"
