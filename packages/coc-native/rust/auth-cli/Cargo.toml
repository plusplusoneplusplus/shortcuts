[package]
name = "auth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Standalone authentication CLI with explicit sources and masked secret output"

[dependencies]
auth-sdk = { path = "../auth-sdk" }
clap = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7"
zeroize = "1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
