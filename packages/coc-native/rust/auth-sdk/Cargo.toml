[package]
name = "auth-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Standalone, source-pinned authentication and secure credential lifecycle"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
fs2 = "0.4"
jsonwebtoken = { version = "9", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "io-util"] }
tokio-util = "0.7"
url = "2"
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"
security-framework-sys = { version = "2", features = ["OSX_10_11"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4", default-features = false, features = ["crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
