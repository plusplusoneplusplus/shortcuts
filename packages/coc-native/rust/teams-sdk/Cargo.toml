[package]
name = "teams-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Account-pinned, bounded Microsoft Teams client"

[features]
default = ["graph"]
graph = []

[dependencies]
async-trait = "0.1"
auth-sdk = { path = "../auth-sdk" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
httpdate = "1"
html-escape = "0.2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", features = ["sink"] }
# Supply roots directly to avoid the built-in feature's obsolete trust-root dependency.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "__rustls-tls"] }
webpki-roots = "1.0.10"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "io-util"] }
