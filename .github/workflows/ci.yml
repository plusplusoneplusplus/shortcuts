name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            scripts/skillopt/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Audit production dependency graph
        run: bash "$GITHUB_WORKSPACE/scripts/ci-npm-audit.sh" --omit=dev

      - name: Audit full dependency graph
        run: bash "$GITHUB_WORKSPACE/scripts/ci-npm-audit.sh"

      - name: Install SkillOpt dependencies
        run: npm ci
        working-directory: scripts/skillopt

      - name: Audit SkillOpt dependency graph
        run: bash "$GITHUB_WORKSPACE/scripts/ci-npm-audit.sh"
        working-directory: scripts/skillopt

      # The Rust file-index crate ships in the release binaries, so its
      # dependencies get the same gate the npm graph gets.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependency graph
        run: cargo audit --file packages/coc-native/rust/Cargo.lock

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

  forge-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build coc-agent-sdk package
        run: npm run build
        working-directory: packages/coc-agent-sdk

      - name: Build forge package
        run: npm run build
        working-directory: packages/forge

      - name: Run forge tests
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:run
        working-directory: packages/forge

      - name: Run forge tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: npm run coverage
        working-directory: packages/forge

      - name: Generate diff coverage report
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: bash ../../scripts/coverage-diff.sh origin/main || true
        working-directory: packages/forge

      - name: Upload forge coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: forge-coverage
          path: packages/forge/coverage/
          retention-days: 14

  # Rust unit layer plus the N-API boundary suite, on every platform we ship a
  # binary for. The binary each job builds is what its own tests run against.
  coc-native:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/coc-native/rust

      - name: Check formatting
        run: cargo fmt --manifest-path packages/coc-native/rust/Cargo.toml --all -- --check

      # The addon crate links against Node's symbols, so only the pure-Rust core
      # crate can be linted and tested with --all-targets.
      - name: Lint
        run: |
          cargo clippy --manifest-path packages/coc-native/rust/Cargo.toml -p coc-native-core --all-targets -- -D warnings
          cargo clippy --manifest-path packages/coc-native/rust/Cargo.toml -p coc-native -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --manifest-path packages/coc-native/rust/Cargo.toml -p coc-native-core

      - name: Install dependencies
        run: npm ci

      - name: Build the addon
        run: npm run build:native -w packages/coc-native

      # src/native-bindings.ts is generated from the `#[napi]` macros but has to
      # be committed, because `npm run build` is plain tsc and must work with no
      # Rust toolchain. The build above just regenerated it, so a diff here means
      # the committed copy no longer matches the Rust.
      - name: Check the generated bindings are current
        shell: bash
        run: |
          if ! git diff --exit-code -- packages/coc-native/src/native-bindings.ts; then
            echo "::error::packages/coc-native/src/native-bindings.ts is stale."
            echo "Run \`npm run build:native -w packages/coc-native\` and commit the result."
            exit 1
          fi

      - name: Run N-API boundary and parity tests
        run: npm run test:run -w packages/coc-native

      - name: Upload the addon
        uses: actions/upload-artifact@v4
        with:
          name: coc-native-${{ matrix.os }}
          path: packages/coc-native/*.node
          if-no-files-found: error
          retention-days: 1

  coc-test:
    runs-on: ${{ matrix.os }}
    needs: [coc-native]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3, 4, 5]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build coc-agent-sdk package
        run: npm run build
        working-directory: packages/coc-agent-sdk

      - name: Build forge package
        run: npm run build
        working-directory: packages/forge

      - name: Build coc-client package
        run: npm run build
        working-directory: packages/coc-client

      - name: Build coc-memory package
        run: npm run build
        working-directory: packages/coc-memory

      - name: Build coc-connector package
        run: npm run build
        working-directory: packages/coc-connector

      - name: Build coc-native package
        run: npm run build
        working-directory: packages/coc-native

      - name: Build coc SPA client bundle
        run: npm run build:client
        working-directory: packages/coc

      # The addon is required, not best-effort: RepoTreeService loads it in its
      # constructor and throws when it cannot, so the suite needs the binary the
      # coc-native job built. The tree-service suite still runs both modes, but
      # the fallback lane is now reached by injecting null, not by its absence.
      - name: Download the addon
        uses: actions/download-artifact@v4
        with:
          name: coc-native-${{ matrix.os }}
          path: packages/coc-native

      - name: Run coc tests (shard ${{ matrix.shard }}/5)
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:run -- --shard=${{ matrix.shard }}/5
        working-directory: packages/coc

      - name: Run coc tests with coverage (shard ${{ matrix.shard }}/5)
        if: matrix.os == 'ubuntu-latest'
        run: npm run coverage -- --shard=${{ matrix.shard }}/5
        working-directory: packages/coc

      - name: Upload coc coverage shard
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coc-coverage-shard-${{ matrix.shard }}
          path: packages/coc/coverage/coverage-final.json
          retention-days: 1

  coc-coverage:
    runs-on: ubuntu-latest
    needs: [coc-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Download coc coverage shards
        uses: actions/download-artifact@v4
        with:
          pattern: coc-coverage-shard-*
          path: packages/coc/coverage-shards/

      - name: Aggregate sharded coverage into lcov.info
        working-directory: packages/coc
        run: |
          set -euo pipefail
          mkdir -p .nyc_output coverage
          i=0
          for f in coverage-shards/coc-coverage-shard-*/coverage-final.json; do
            if [ -f "$f" ]; then
              i=$((i+1))
              cp "$f" ".nyc_output/shard-$i.json"
              echo "==> Loaded shard $i from $f"
            fi
          done
          if [ "$i" -eq 0 ]; then
            echo "ERROR: no coverage-final.json shard inputs found under coverage-shards/" >&2
            exit 1
          fi
          npx --yes nyc@15 report \
            --temp-dir .nyc_output \
            --report-dir coverage \
            --reporter=lcov \
            --reporter=cobertura \
            --reporter=html \
            --reporter=text

      - name: Generate diff coverage report
        if: github.event_name == 'pull_request'
        working-directory: packages/coc
        env:
          SKIP_TESTS: '1'
        run: bash ../../scripts/coverage-diff.sh origin/main || true

      - name: Upload merged coc coverage
        uses: actions/upload-artifact@v4
        with:
          name: coc-coverage
          path: packages/coc/coverage/
          retention-days: 14

  deep-wiki-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build coc-agent-sdk package
        run: npm run build
        working-directory: packages/coc-agent-sdk

      - name: Build forge package
        run: npm run build
        working-directory: packages/forge

      - name: Run deep-wiki tests
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:run
        working-directory: packages/deep-wiki

      - name: Run deep-wiki tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: npm run coverage
        working-directory: packages/deep-wiki

      - name: Generate diff coverage report
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: bash ../../scripts/coverage-diff.sh origin/main || true
        working-directory: packages/deep-wiki

      - name: Upload deep-wiki coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: deep-wiki-coverage
          path: packages/deep-wiki/coverage/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install native build dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: apt-get update && apt-get install -y --no-install-recommends build-essential

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build coc-agent-sdk package
        run: npm run build
        working-directory: packages/coc-agent-sdk

      - name: Build forge package
        run: npm run build
        working-directory: packages/forge

      - name: Build coc-client package
        run: npm run build
        working-directory: packages/coc-client

      - name: Build coc-memory package
        run: npm run build
        working-directory: packages/coc-memory

      - name: Build coc-connector package
        run: npm run build
        working-directory: packages/coc-connector

      - name: Build coc SPA client bundle
        run: npm run build:client
        working-directory: packages/coc

      - name: Build coc package
        run: npm run build
        working-directory: packages/coc

      # The fixture boots the server in-process, and RepoTreeService now throws
      # when no addon loaded. Nothing builds one here, so take the supported
      # opt-out: these specs drive the UI, and the fallback search path answers
      # them identically. coc-test is where the addon's own lane is covered.
      - name: Run Playwright E2E tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --config test/e2e/playwright.config.ts --shard=${{ matrix.shard }}/4
        working-directory: packages/coc
        env:
          COC_NATIVE: '0'

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: packages/coc/playwright-report/
          retention-days: 7

  coc-serve-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      # A plain checkout has no binary and no Rust toolchain, which the loader
      # treats as fatal. This job asks one question — does `coc serve` come up
      # and answer /api/health — so it runs the way the docs tell such a machine
      # to run.
      - name: Start coc serve and verify health
        shell: bash
        env:
          COC_NATIVE: '0'
        run: |
          # Pipe from sleep to keep stdin open (prevents Windows readline 'close' shutdown)
          sleep 120 | node packages/coc/dist/index.js serve --no-open --port 4111 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4111/api/health > /dev/null 2>&1; then
              echo "✓ Server healthy after ${i}s"
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "✗ Server failed to respond within 60s"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  coccontainer-serve-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Build coccontainer package
        run: npm run build
        working-directory: packages/coccontainer

      - name: Start coccontainer serve and verify health
        shell: bash
        run: |
          sleep 120 | node packages/coccontainer/dist/index.js serve --no-open --port 4222 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4222/api/container/agents > /dev/null 2>&1; then
              echo "✓ CoCContainer healthy after ${i}s"
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "✗ CoCContainer failed to respond within 60s"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  coc-desktop-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build coc-desktop package
        run: npm run build
        working-directory: packages/coc-desktop

      - name: Run coc-desktop tests
        run: npm run test:run
        working-directory: packages/coc-desktop

  workflow-policy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Run workflow policy tests
        run: node --test scripts/release-workflow.test.mjs scripts/ci-npm-audit.test.mjs scripts/workflow-actions.test.mjs scripts/docker-workflow.test.mjs scripts/native-addon-workflow.test.mjs

  # Guards the server image (Dockerfile + docker/entrypoint.sh) against rotting
  # between releases: real linux/amd64 build (no push), then health, the
  # loopback-only bind, graceful drain, the same-netns sidecar path, and the CLI.
  docker-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: coc:ci
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Start container (host network, loopback bind) and verify health
        run: |
          # No prebuilt binaries are staged into the CI image (the release job
          # does that), so the loader would refuse to start. Opting out keeps
          # this job about the image itself.
          docker run -d --name coc --network host -e COC_NATIVE=0 coc:ci --host 127.0.0.1 --port 4111 --data-dir /data/.coc
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4111/api/health > /dev/null 2>&1; then
              echo "✓ Server healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "✗ Server failed to respond within 90s"
          docker logs coc
          exit 1

      # The release build injects prebuilt binaries and asserts loaded==true;
      # this container runs with COC_NATIVE=0, so the field only has to be
      # present and well-formed — a change that drops it from /api/health then
      # fails here, before it reaches a release.
      - name: Assert /api/health reports the file-index mode
        run: |
          curl -sf http://127.0.0.1:4111/api/health \
            | node -e 'const h=JSON.parse(require("fs").readFileSync(0,"utf8"));
                       if (typeof h.nativeFileIndex?.loaded !== "boolean") {
                         console.error("✗ /api/health is missing nativeFileIndex.loaded");
                         process.exit(1);
                       }
                       console.log("native file index loaded:", h.nativeFileIndex.loaded);'

      - name: Assert the server is NOT reachable off-loopback
        run: |
          HOST_IP=$(hostname -I | awk '{print $1}')
          if curl -sf --max-time 3 "http://${HOST_IP}:4111/api/health"; then
            echo "✗ reachable on ${HOST_IP}:4111 — the server must be loopback-only"
            exit 1
          fi
          # /proc/net/tcp: local address 0100007F:100F == 127.0.0.1:4111
          docker exec coc sh -c 'grep -qi " 0100007F:100F " /proc/net/tcp'
          if docker exec coc sh -c 'grep -qi " 00000000:100F " /proc/net/tcp /proc/net/tcp6'; then
            echo "✗ found a 0.0.0.0/:: listener on 4111"
            exit 1
          fi
          echo "✓ listener is bound to 127.0.0.1 only"

      - name: Data lands on the volume and the process runs as the node user
        run: |
          docker exec coc sh -c 'test -f /data/.coc/processes.db' || { echo "✗ /data/.coc/processes.db missing"; docker exec coc ls -la /data/.coc; exit 1; }
          [ "$(docker exec coc id -u)" = "1000" ]
          echo "✓ processes.db is on /data and the server runs as uid 1000"

      - name: Graceful stop drains and exits 0
        run: |
          docker stop -t 60 coc
          code="$(docker inspect -f '{{.State.ExitCode}}' coc)"
          echo "exit code: $code"
          [ "$code" = "0" ] || { docker logs coc; exit 1; }

      - name: Sidecar pattern smoke (same netns reaches loopback)
        run: |
          docker run -d --name coc2 -e COC_NATIVE=0 coc:ci   # default bridge, no ports, loopback bind
          docker run --rm --network container:coc2 curlimages/curl:latest \
            sh -c 'for i in $(seq 1 90); do curl -sf http://127.0.0.1:4000/api/health && exit 0; sleep 1; done; exit 1' \
            || { docker logs coc2; exit 1; }
          docker stop -t 60 coc2

      - name: CLI available in image
        run: |
          docker run --rm --entrypoint coc coc:ci --version
          docker run --rm --entrypoint git coc:ci --version
          docker run --rm --entrypoint gh coc:ci --version

  ci:
    runs-on: ubuntu-latest
    needs: [dependency-security, lint, forge-test, coc-native, coc-test, coc-coverage, deep-wiki-test, e2e, coc-serve-smoke, coccontainer-serve-smoke, coc-desktop-test, workflow-policy-test, docker-build-smoke]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          declare -A results=(
            [dependency-security]="${{ needs.dependency-security.result }}"
            [lint]="${{ needs.lint.result }}"
            [forge-test]="${{ needs.forge-test.result }}"
            [coc-native]="${{ needs.coc-native.result }}"
            [coc-test]="${{ needs.coc-test.result }}"
            [coc-coverage]="${{ needs.coc-coverage.result }}"
            [deep-wiki-test]="${{ needs.deep-wiki-test.result }}"
            [e2e]="${{ needs.e2e.result }}"
            [coc-serve-smoke]="${{ needs.coc-serve-smoke.result }}"
            [coccontainer-serve-smoke]="${{ needs.coccontainer-serve-smoke.result }}"
            [coc-desktop-test]="${{ needs.coc-desktop-test.result }}"
            [workflow-policy-test]="${{ needs.workflow-policy-test.result }}"
            [docker-build-smoke]="${{ needs.docker-build-smoke.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            status="${results[$job]}"
            echo "$job: $status"
            if [[ "$status" != "success" ]]; then
              failed=1
            fi
          done
          if [[ $failed -ne 0 ]]; then
            echo "::error::One or more required CI jobs did not succeed."
            exit 1
          fi
          echo "All required CI jobs succeeded."
