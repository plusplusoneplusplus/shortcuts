name: Symbol Index Benchmark

on:
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: LLVM branch or tag to benchmark
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  native-build:
    name: native-${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: linux-x64-gnu
            container: node:24-bookworm
          - runner: ubuntu-24.04-arm
            triple: linux-arm64-gnu
            container: node:24-bookworm
          - runner: macos-latest
            triple: darwin-arm64
          - runner: macos-15-intel
            triple: darwin-x64
          - runner: windows-latest
            triple: win32-x64-msvc
          - runner: windows-11-arm
            triple: win32-arm64-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Trust the workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/coc-native/rust
          key: platform-validation-${{ matrix.triple }}

      - name: Install dependencies
        run: npm ci

      - name: Run Rust unit tests
        run: cargo test --manifest-path packages/coc-native/rust/Cargo.toml -p coc-native-core

      - name: Build the addon
        run: npm run build:native -w packages/coc-native

      - name: Verify target binary
        shell: bash
        run: test -f "packages/coc-native/coc-native.${{ matrix.triple }}.node"

  clangd-integration:
    name: clangd-${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-latest
          - label: windows-x64
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install clangd on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install clangd on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify clangd
        run: clangd --version

      - name: Run real clangd integration tests
        working-directory: packages/coc
        run: node scripts/run-vitest.mjs test/server/language-servers/clangd-integration.test.ts

  resolve-corpus:
    runs-on: ubuntu-latest
    outputs:
      llvm_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve LLVM revision
        id: resolve
        shell: bash
        env:
          LLVM_REF: ${{ inputs.llvm_ref }}
        run: |
          if [[ "$LLVM_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            sha="${LLVM_REF,,}"
          else
            sha="$(git ls-remote https://github.com/llvm/llvm-project.git \
              "$LLVM_REF" "refs/heads/$LLVM_REF" "refs/tags/$LLVM_REF" \
              "refs/tags/$LLVM_REF^{}" | tail -n 1 | cut -f1)"
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  benchmark:
    name: ${{ matrix.label }}
    needs: resolve-corpus
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
            cold_arg: --drop-linux-page-cache
          - label: windows-x64
            runner: windows-latest
            cold_arg: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/coc-native/rust
          key: symbol-index-benchmark-${{ matrix.label }}

      - name: Install dependencies
        run: npm ci

      - name: Clone LLVM corpus
        shell: bash
        env:
          LLVM_SHA: ${{ needs.resolve-corpus.outputs.llvm_sha }}
        run: |
          git init "$GITHUB_WORKSPACE/llvm-project"
          git -C "$GITHUB_WORKSPACE/llvm-project" remote add origin \
            https://github.com/llvm/llvm-project.git
          git -C "$GITHUB_WORKSPACE/llvm-project" fetch --depth 1 origin "$LLVM_SHA"
          git -C "$GITHUB_WORKSPACE/llvm-project" -c core.autocrlf=false \
            checkout --detach FETCH_HEAD

      - name: Run storage benchmark
        shell: bash
        run: |
          mkdir -p benchmark-results
          node packages/coc-native/scripts/bench-symbol-storage.mjs \
            --files 100000 --runs 5 --target-lines 32000 --json \
            > "benchmark-results/storage-${{ matrix.label }}.json"

      - name: Run extraction benchmark
        shell: bash
        env:
          COLD_ARG: ${{ matrix.cold_arg }}
        run: |
          node packages/coc-native/scripts/bench-symbol-index.mjs \
            --repo "$GITHUB_WORKSPACE/llvm-project" \
            --threads 1,2,4 --warmup 1 --runs 3 $COLD_ARG --json \
            > "benchmark-results/extraction-${{ matrix.label }}.json"
          git -C "$GITHUB_WORKSPACE/llvm-project" rev-parse HEAD \
            > "benchmark-results/llvm-commit.txt"

      - name: Add benchmark summary
        shell: bash
        run: |
          {
            echo "## Symbol index benchmark (${{ matrix.label }})"
            echo '### Storage'
            echo '```json'
            cat "benchmark-results/storage-${{ matrix.label }}.json"
            echo '```'
            echo '### Extraction'
            echo '```json'
            cat "benchmark-results/extraction-${{ matrix.label }}.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: symbol-index-benchmark-${{ matrix.label }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
