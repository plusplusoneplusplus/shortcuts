name: Release

# Build and publish the CoC desktop binaries when a release tag is pushed or
# when a release tag is dispatched manually.
# Fires for stable tags (v1.2.3) and pre-release tags (v1.2.3-alpha.1, -beta.2, -rc.1, ...).
# Pre-release tags produce a non-draft GitHub Release marked as pre-release.
# Stable tags produce a draft GitHub Release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v3.4.8-alpha.1'
        required: true
        type: string

# create-release needs the injected GITHUB_TOKEN to create a GitHub Release;
# build-docker needs it to push to ghcr.io.
permissions:
  contents: write
  packages: write

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            scripts/skillopt/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Audit production dependency graph
        run: bash "$GITHUB_WORKSPACE/scripts/ci-npm-audit.sh" --omit=dev

      - name: Audit full dependency graph
        run: bash "$GITHUB_WORKSPACE/scripts/ci-npm-audit.sh"

      - name: Install SkillOpt dependencies
        run: npm ci
        working-directory: scripts/skillopt

      - name: Audit SkillOpt dependency graph
        run: bash "$GITHUB_WORKSPACE/scripts/ci-npm-audit.sh"
        working-directory: scripts/skillopt

  # AC-03 — macOS binary (.dmg).
  build-mac:
    needs: dependency-security
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # AC-02 — write the tag's semver (minus the leading "v") into the desktop
      # package.json for this build only. Never committed back to the repo.
      - name: Sync desktop version from tag
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          export VERSION
          echo "Setting coc-desktop version to $VERSION"
          node -e "const fs=require('fs');const p='packages/coc-desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      # Root build also produces the coc server bundle the app embeds
      # (electron-builder packs node_modules/@plusplusoneplusplus/coc/dist/**).
      - name: Build packages
        run: npm run build

      - name: Build macOS distributables
        run: npm run dist:mac
        working-directory: packages/coc-desktop
        env:
          # No signing certs yet (out of scope) — stop electron-builder from
          # trying to auto-discover a macOS signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coc-mac
          path: packages/coc-desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7

  # AC-04 — Windows installer (.exe via nsis). Mirrors build-mac.
  build-win:
    needs: dependency-security
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # AC-02 — same version sync as the mac job (build-only, not committed).
      - name: Sync desktop version from tag
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          export VERSION
          echo "Setting coc-desktop version to $VERSION"
          node -e "const fs=require('fs');const p='packages/coc-desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - name: Build packages
        run: npm run build

      # Both scripts run prebuild:sqlite:win before electron-builder.
      - name: Build CoC Windows distributable
        run: npm run dist:win
        working-directory: packages/coc-desktop

      - name: Build CoCContainer Windows distributable
        run: npm run dist:win:container
        working-directory: packages/coc-desktop

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coc-win
          path: packages/coc-desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  # Server image → ghcr.io/<owner>/coc. Runs beside the desktop builds; a
  # docker failure does not block the desktop release (create-release does not
  # need it) and vice versa.
  # Tags: v3.4.8 → 3.4.8, 3.4, latest; v3.4.8-alpha.1 → 3.4.8-alpha.1 only.
  build-docker:
    needs: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # GHCR requires a lowercase image name; github.repository_owner is
      # lowercase for this repo — fail loudly if that ever changes.
      - name: Resolve image name
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$OWNER" != "$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::repository owner '$OWNER' is not lowercase; GHCR image names must be lowercase"
            exit 1
          fi
          echo "name=ghcr.io/${OWNER}/coc" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=CoC
            org.opencontainers.image.description=CoC (Copilot of Copilot) server

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: false

  # AC-05 — collect both platforms' artifacts into a single draft release.
  create-release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mapfile -t files < <(find artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No artifacts were downloaded for the release."
            exit 1
          fi
          echo "Attaching ${#files[@]} file(s) to the release:"
          printf '  %s\n' "${files[@]}"

          # Detect pre-release: tag has a suffix after the semver (e.g. -alpha.1, -beta.2, -rc.1).
          VERSION="${TAG#v}"
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            IS_PRERELEASE=true
            PRERELEASE_FLAG="--prerelease"
            DRAFT_FLAGS=()
          else
            IS_PRERELEASE=false
            PRERELEASE_FLAG=""
            DRAFT_FLAGS=(--draft)
          fi

          # Install/troubleshooting notes. The builds are not yet code-signed or
          # notarized, so macOS Gatekeeper reports the downloaded app as
          # "damaged" — document the quarantine workaround so testers aren't blocked.
          notes_file="$(mktemp)"
          {
            if [ "$IS_PRERELEASE" = "true" ]; then
              cat <<EOF
          > [!WARNING]
          > **Pre-release build** — This is an early/unstable release. Expect rough edges and possible breaking changes. Please [report issues](../../issues) if you hit problems.

          EOF
            fi
            cat <<EOF
          ## Install

          ### macOS (Apple Silicon)
          1. Open \`CoC-${VERSION}-arm64.dmg\` and drag **CoC** into your Applications folder.
          2. On first launch macOS may say **"CoC is damaged and can't be opened."** This build is **not yet code-signed or notarized**, so Gatekeeper blocks the downloaded file — it is **not** actually corrupt. Clear the download quarantine flag, then open it normally:
             \`\`\`
             xattr -dr com.apple.quarantine /Applications/CoC.app
             \`\`\`
             (Adjust the path if you installed CoC elsewhere.)

          ### Windows — CoC
          Run \`CoC.Setup.${VERSION}.exe\`. SmartScreen may warn about an unknown publisher — choose **More info → Run anyway**. This installer is also unsigned for now.

          ### Windows — CoCContainer
          Run \`CoCContainer.Setup.${VERSION}.exe\` to install the multi-agent aggregation dashboard. SmartScreen may show the same unsigned-publisher warning.

          ### Docker (server only, Linux amd64/arm64)
          \`\`\`
          docker run --network host -v coc-data:/data ghcr.io/${OWNER}/coc:${VERSION}
          \`\`\`
          Then open http://127.0.0.1:4000. The server binds loopback inside the container, so use \`--network host\` (not \`-p\`). See the README's "Run with Docker" section.
          EOF
          } > "$notes_file"

          gh release create "$TAG" \
            "${DRAFT_FLAGS[@]}" \
            $PRERELEASE_FLAG \
            --title "CoC $TAG" \
            --notes-file "$notes_file" \
            "${files[@]}"
