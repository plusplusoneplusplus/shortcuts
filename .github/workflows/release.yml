name: Release

# Build and publish the CoC desktop binaries when a release tag is pushed or
# when a release tag is dispatched manually.
# Fires for stable tags (v1.2.3) and pre-release tags (v1.2.3-alpha.1, -beta.2, -rc.1, ...).
# Pre-release tags produce a non-draft GitHub Release marked as pre-release.
# Stable tags produce a draft GitHub Release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v3.4.8-alpha.1'
        required: true
        type: string
      allow_native_fallback:
        description: 'Ship even if a native file-index binary fails to build (degrades that platform to the slow JS search)'
        required: false
        default: false
        type: boolean

# create-release needs the injected GITHUB_TOKEN to create a GitHub Release;
# build-docker needs it to push to ghcr.io.
permissions:
  contents: write
  packages: write

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            scripts/skillopt/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Audit production dependency graph
        run: bash "$GITHUB_WORKSPACE/scripts/ci-npm-audit.sh" --omit=dev

      - name: Audit full dependency graph
        run: bash "$GITHUB_WORKSPACE/scripts/ci-npm-audit.sh"

      - name: Install SkillOpt dependencies
        run: npm ci
        working-directory: scripts/skillopt

      - name: Audit SkillOpt dependency graph
        run: bash "$GITHUB_WORKSPACE/scripts/ci-npm-audit.sh"
        working-directory: scripts/skillopt

      # The Rust file-index crate ships inside the release binaries, so its
      # dependencies get the same gate the npm graph gets.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependency graph
        run: cargo audit --file packages/coc-native/rust/Cargo.lock

  # AC-03 — macOS binary (.dmg).
  # One N-API binary per shipped platform. Each runs its own Rust and boundary
  # tests before uploading — a release binary that never executed its tests on
  # its own platform does not ship.
  #
  # Blocking by design: silently shipping the JavaScript fallback is exactly the
  # regression this exists to prevent. Use the allow_native_fallback dispatch
  # input to override.
  build-native:
    needs: dependency-security
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            triple: linux-arm64-gnu
          # The macOS app ships as an arm64-only .dmg, so an Intel Mac
          # prebuilt would have no consumer.
          - runner: macos-latest
            triple: darwin-arm64
          - runner: windows-latest
            triple: win32-x64-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/coc-native/rust
          key: ${{ matrix.triple }}

      - name: Install dependencies
        run: npm ci

      - name: Run Rust unit tests
        run: cargo test --manifest-path packages/coc-native/rust/Cargo.toml -p coc-native-core

      - name: Build the addon
        run: npm run build:native -w packages/coc-native

      - name: Verify the binary matches the target triple
        shell: bash
        run: test -f "packages/coc-native/coc-native.${{ matrix.triple }}.node"

      - name: Run N-API boundary and parity tests
        run: npm run test:run -w packages/coc-native

      - name: Upload the addon
        uses: actions/upload-artifact@v4
        with:
          name: coc-native-${{ matrix.triple }}
          path: packages/coc-native/coc-native.${{ matrix.triple }}.node
          if-no-files-found: error
          retention-days: 7

  build-mac:
    needs: [dependency-security, build-native]
    # A missing native binary blocks the release unless the dispatch explicitly
    # opts into shipping the slower JavaScript file-search fallback.
    if: >-
      always()
      && needs.dependency-security.result == 'success'
      && (needs.build-native.result == 'success'
          || github.event.inputs.allow_native_fallback == 'true')
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # AC-02 — write the tag's semver (minus the leading "v") into the desktop
      # package.json for this build only. Never committed back to the repo.
      - name: Sync desktop version from tag
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          export VERSION
          echo "Setting coc-desktop version to $VERSION"
          node -e "const fs=require('fs');const p='packages/coc-desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      # Root build also produces the coc server bundle the app embeds
      # (electron-builder packs node_modules/@plusplusoneplusplus/coc/dist/**).
      - name: Build packages
        run: npm run build

      # electron-builder packs packages/coc-native/prebuilt/** with the app.
      # N-API binaries are ABI-stable, so the same file works under Node and
      # Electron — no electron-rebuild step, unlike better-sqlite3.
      - name: Download native file-index binaries
        if: needs.build-native.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: coc-native-darwin-*
          path: packages/coc-native/artifacts

      - name: Stage native file-index binaries
        if: needs.build-native.result == 'success'
        shell: bash
        run: |
          node scripts/stage-native-binaries.mjs packages/coc-native/artifacts
          test -f packages/coc-native/prebuilt/darwin-arm64/coc-native.darwin-arm64.node

      - name: Build macOS distributables
        run: npm run dist:mac
        working-directory: packages/coc-desktop
        env:
          # No signing certs yet (out of scope) — stop electron-builder from
          # trying to auto-discover a macOS signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coc-mac
          path: packages/coc-desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7

  # AC-04 — Windows installer (.exe via nsis). Mirrors build-mac.
  build-win:
    needs: [dependency-security, build-native]
    # A missing native binary blocks the release unless the dispatch explicitly
    # opts into shipping the slower JavaScript file-search fallback.
    if: >-
      always()
      && needs.dependency-security.result == 'success'
      && (needs.build-native.result == 'success'
          || github.event.inputs.allow_native_fallback == 'true')
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # AC-02 — same version sync as the mac job (build-only, not committed).
      - name: Sync desktop version from tag
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          export VERSION
          echo "Setting coc-desktop version to $VERSION"
          node -e "const fs=require('fs');const p='packages/coc-desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - name: Build packages
        run: npm run build

      - name: Download native file-index binaries
        if: needs.build-native.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: coc-native-win32-*
          path: packages/coc-native/artifacts

      - name: Stage native file-index binaries
        if: needs.build-native.result == 'success'
        shell: bash
        run: |
          node scripts/stage-native-binaries.mjs packages/coc-native/artifacts
          test -f packages/coc-native/prebuilt/win32-x64-msvc/coc-native.win32-x64-msvc.node

      # Both scripts run prebuild:sqlite:win before electron-builder.
      - name: Build CoC Windows distributable
        run: npm run dist:win
        working-directory: packages/coc-desktop

      - name: Build CoCContainer Windows distributable
        run: npm run dist:win:container
        working-directory: packages/coc-desktop

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coc-win
          path: packages/coc-desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  # Server image → ghcr.io/<owner>/coc. Runs beside the desktop builds; a
  # docker failure does not block the desktop release (create-release does not
  # need it) and vice versa.
  # Tags: v3.4.8 → 3.4.8, 3.4, latest; v3.4.8-alpha.1 → 3.4.8-alpha.1 only.
  build-docker:
    needs: [dependency-security, build-native]
    # A missing native binary blocks the release unless the dispatch explicitly
    # opts into shipping the slower JavaScript file-search fallback.
    if: >-
      always()
      && needs.dependency-security.result == 'success'
      && (needs.build-native.result == 'success'
          || github.event.inputs.allow_native_fallback == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # GHCR requires a lowercase image name; github.repository_owner is
      # lowercase for this repo — fail loudly if that ever changes.
      - name: Resolve image name
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$OWNER" != "$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::repository owner '$OWNER' is not lowercase; GHCR image names must be lowercase"
            exit 1
          fi
          echo "name=ghcr.io/${OWNER}/coc" >> "$GITHUB_OUTPUT"

      # Staged into the build context, not compiled in-image: the arm64 stage is
      # qemu-emulated and building Rust there would dominate the build time.
      - name: Download native file-index binaries
        if: needs.build-native.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: coc-native-linux-*
          path: packages/coc-native/artifacts

      - name: Stage native file-index binaries
        if: needs.build-native.result == 'success'
        shell: bash
        run: |
          node scripts/stage-native-binaries.mjs packages/coc-native/artifacts
          test -f packages/coc-native/prebuilt/linux-x64-gnu/coc-native.linux-x64-gnu.node
          test -f packages/coc-native/prebuilt/linux-arm64-gnu/coc-native.linux-arm64-gnu.node

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=CoC
            org.opencontainers.image.description=CoC (Copilot of Copilot) server

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: false

      # A packaging mistake must fail here, not degrade silently into the slow
      # JavaScript file search in production.
      - name: Smoke the pushed image and assert the native file index loaded
        if: needs.build-native.result == 'success'
        shell: bash
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name coc-release-smoke --network host "$IMAGE" \
            --host 127.0.0.1 --port 4111 --data-dir /data/.coc
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:4111/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4111/api/health \
            | node -e 'const h=JSON.parse(require("fs").readFileSync(0,"utf8"));
                       if (!h.nativeFileIndex?.loaded) {
                         console.error("✗ native file index did not load:", h.nativeFileIndex?.reason);
                         process.exit(1);
                       }
                       console.log("✓ native file index loaded:", h.nativeFileIndex.binaryPath);'
          docker logs coc-release-smoke 2>&1 | grep -F "native file index: loaded"

  # AC-05 — collect both platforms' artifacts into a single draft release.
  create-release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      # Installers only. The coc-native-* artifacts are the raw N-API
      # binaries the build jobs hand to electron-builder — they are already
      # packed inside each installer and are not a public download.
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coc-{mac,win}
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Ship the CoC installers only: no loose .node binaries, and no
          # CoCContainer build (an internal variant, not a public download).
          mapfile -t files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) \
            ! -name 'CoCContainer*' ! -name '*.node' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No artifacts were downloaded for the release."
            exit 1
          fi
          echo "Attaching ${#files[@]} file(s) to the release:"
          printf '  %s\n' "${files[@]}"

          # Detect pre-release: tag has a suffix after the semver (e.g. -alpha.1, -beta.2, -rc.1).
          VERSION="${TAG#v}"
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            IS_PRERELEASE=true
            PRERELEASE_FLAG="--prerelease"
            DRAFT_FLAGS=()
          else
            IS_PRERELEASE=false
            PRERELEASE_FLAG=""
            DRAFT_FLAGS=(--draft)
          fi

          # Install/troubleshooting notes. The builds are not yet code-signed or
          # notarized, so macOS Gatekeeper reports the downloaded app as
          # "damaged" — document the quarantine workaround so testers aren't blocked.
          notes_file="$(mktemp)"
          {
            if [ "$IS_PRERELEASE" = "true" ]; then
              cat <<EOF
          > [!WARNING]
          > **Pre-release build** — This is an early/unstable release. Expect rough edges and possible breaking changes. Please [report issues](../../issues) if you hit problems.

          EOF
            fi
            cat <<EOF
          ## Install

          ### macOS (Apple Silicon)
          1. Open \`CoC-${VERSION}-arm64.dmg\` and drag **CoC** into your Applications folder.
          2. On first launch macOS may say **"CoC is damaged and can't be opened."** This build is **not yet code-signed or notarized**, so Gatekeeper blocks the downloaded file — it is **not** actually corrupt. Clear the download quarantine flag, then open it normally:
             \`\`\`
             xattr -dr com.apple.quarantine /Applications/CoC.app
             \`\`\`
             (Adjust the path if you installed CoC elsewhere.)

          ### Windows — CoC
          Run \`CoC.Setup.${VERSION}.exe\`. SmartScreen may warn about an unknown publisher — choose **More info → Run anyway**. This installer is also unsigned for now.

          ### Docker (server only, Linux amd64/arm64)
          \`\`\`
          docker run --network host -v coc-data:/data ghcr.io/${OWNER}/coc:${VERSION}
          \`\`\`
          Then open http://127.0.0.1:4000. The server binds loopback inside the container, so use \`--network host\` (not \`-p\`). See the README's "Run with Docker" section.
          EOF
          } > "$notes_file"

          gh release create "$TAG" \
            "${DRAFT_FLAGS[@]}" \
            $PRERELEASE_FLAG \
            --title "CoC $TAG" \
            --notes-file "$notes_file" \
            "${files[@]}"
